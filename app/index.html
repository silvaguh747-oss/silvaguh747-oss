<title>Meu Dinheiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: coluna única centrada (até 760px), cabeçalho fixo com seletor de mês, navegação inferior de 5 abas. */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --surface2:#eaf0ee; --fg:#14211e; --muted:#5d6f6a; --line:#d9e2df;
  --accent:#0b7a6b; --accent-fg:#ffffff; --good:#1a8f55; --warn:#b7791f; --bad:#c0392b; --info:#2b6cb0;
  --good-bg:#e1f4e9; --warn-bg:#fbf1d9; --bad-bg:#fbe5e2;
  --display:"Space Grotesk","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1816; --surface:#16231f; --surface2:#1d2d28; --fg:#e6f0ed; --muted:#93a7a1; --line:#294039;
  --accent:#35c2ab; --accent-fg:#05201b; --good:#4cc98a; --warn:#e6b450; --bad:#ff7b6b; --info:#6aa9ee;
  --good-bg:#16352a; --warn-bg:#3a3017; --bad-bg:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1816; --surface:#16231f; --surface2:#1d2d28; --fg:#e6f0ed; --muted:#93a7a1; --line:#294039;
  --accent:#35c2ab; --accent-fg:#05201b; --good:#4cc98a; --warn:#e6b450; --bad:#ff7b6b; --info:#6aa9ee;
  --good-bg:#16352a; --warn-bg:#3a3017; --bad-bg:#3d1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 86px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 0 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:18px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.month{display:flex;align-items:center;gap:6px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;cursor:pointer}
.month b{min-width:130px;text-align:center;text-transform:capitalize;font-family:var(--display)}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
section.card>h2{font-size:15px;margin-bottom:12px;letter-spacing:.01em}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi strong{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;margin:2px 0;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:11px}
.pos{color:var(--good)}.neg{color:var(--bad)}.inf{color:var(--info)}
.bar{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar i.good{background:var(--good)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .bar{grid-column:1/-1}
.row small{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--surface2);color:var(--muted)}
.rec{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);margin-bottom:8px;font-size:14px}
.rec.good{background:var(--good-bg)}.rec.warn{background:var(--warn-bg)}.rec.bad{background:var(--bad-bg)}
.rec b{flex:none;width:18px;text-align:center}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:44px}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:120px;width:100%;justify-content:center}
.chart .bars i{display:block;width:30%;max-width:12px;border-radius:3px 3px 0 0;min-height:1px}
.chart small{font-size:10px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.empty{text-align:center;padding:20px 10px;color:var(--muted)}
.tx{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.tx small{color:var(--muted);grid-column:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:760px;gap:4px}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:6px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
nav button span{font-size:19px;line-height:1}
nav button[aria-current="page"]{color:var(--accent);background:var(--surface2);font-weight:700}
.editrow{display:grid;grid-template-columns:2fr 1.3fr 1fr auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.editrow.g5{grid-template-columns:repeat(2,1fr)}
@media(min-width:600px){.editrow.g5{grid-template-columns:2fr 1fr 1fr 1fr 1fr auto}.editrow.d4{grid-template-columns:2fr 1fr 1fr 1fr auto}}
.editrow.d4{grid-template-columns:repeat(2,1fr)}
.note{font-size:12px;color:var(--muted)}
.sync{font-size:11px;color:var(--muted)}
.hint{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<div class="wrap">
<header><div class="hrow">
  <div class="brand">Meu Dinheiro<small id="sync">Carregando…</small></div>
  <div class="month" id="monthnav"><button id="prev" aria-label="Mês anterior">‹</button><b id="mlabel"></b><button id="next" aria-label="Próximo mês">›</button></div>
</div></header>
<main id="view"></main>
</div>
<nav><div class="in" id="tabs"></div></nav>

<script>
(function(){
"use strict";
const TABS=[["painel","▦","Painel"],["lancar","＋","Lançar"],["anual","▤","Anual"],["metas","◎","Metas"],["ajustes","⚙","Ajustes"]];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DEFAULT_CFG={name:"",income:7500,reserveStart:0,months:6,mNec:.5,mDes:.3,mPoup:.2,simA:500,simT:.10,simY:10,
 cats:[
  {n:"Salário",t:"Receita",g:"Receita",b:0},{n:"Renda extra",t:"Receita",g:"Receita",b:0},{n:"Outras receitas",t:"Receita",g:"Receita",b:0},
  {n:"Moradia",t:"Despesa",g:"Necessidades",b:1800},{n:"Mercado",t:"Despesa",g:"Necessidades",b:700},{n:"Transporte",t:"Despesa",g:"Necessidades",b:350},
  {n:"Saúde",t:"Despesa",g:"Necessidades",b:150},{n:"Educação",t:"Despesa",g:"Necessidades",b:100},{n:"Contas da casa",t:"Despesa",g:"Necessidades",b:300},
  {n:"Dívidas e parcelas",t:"Despesa",g:"Necessidades",b:0},{n:"Restaurantes e delivery",t:"Despesa",g:"Desejos",b:300},{n:"Lazer",t:"Despesa",g:"Desejos",b:250},
  {n:"Assinaturas",t:"Despesa",g:"Desejos",b:80},{n:"Compras",t:"Despesa",g:"Desejos",b:250},{n:"Viagens",t:"Despesa",g:"Desejos",b:200},{n:"Outros",t:"Despesa",g:"Desejos",b:100},
  {n:"Reserva de Emergência",t:"Investimento",g:"Poupança",b:400,r:true},{n:"Investimentos",t:"Investimento",g:"Poupança",b:300}],
 goals:[],debts:[]};
const PAYS=["Pix","Cartão de crédito","Cartão de débito","Dinheiro","Transferência","Boleto"];
let tx=[],cfg=JSON.parse(JSON.stringify(DEFAULT_CFG)),tab="painel",ytd=new Date().getFullYear(),loaded=false,mode="local";
let now=new Date(),sel={y:now.getFullYear(),m:now.getMonth()+1},kind="Despesa",db=null,cfgTimer=null,armed=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pc=v=>Math.round((v||0)*100)+"%";
const num=s=>{s=String(s==null?"":s).trim();if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)||0};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const catOf=n=>cfg.cats.find(c=>c.n===n);
const refOf=t=>{const p=(t.date||"").split("-");return +p[0]*100+ +p[1]};
const monthName=(m)=>MESES[m-1];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- storage ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function mergeCfg(c){cfg=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),c||{});}
async function addTx(t){
  if(db){await db.collection("tx").doc(t.id).set(t)}else{tx.push(t);lsSet("tx",tx);render()}
}
async function delTx(id){
  if(db){await db.collection("tx").doc(id).delete()}else{tx=tx.filter(x=>x.id!==id);lsSet("tx",tx);render()}
}
function saveCfg(){
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(()=>{ if(db){db.doc("app/settings").set(cfg).catch(()=>setSync("Erro ao salvar"))}else lsSet("cfg",cfg); },500);
}
function setSync(t){$("#sync").textContent=t}
async function init(){
  render();
  let d=null;
  try{d=await claude.use("db")}catch(e){d=null}
  if(d){
    db=d;mode="nuvem";setSync("Sincronizado • celular e PC");
    let t1=setTimeout(()=>{if(!loaded){loaded=true;render()}},10000);
    db.collection("tx").onSnapshot(s=>{tx=s.docs.map(x=>Object.assign({id:x.id},x.data()));loaded=true;clearTimeout(t1);render()},()=>setSync("Sem conexão com o banco"));
    db.doc("app/settings").onSnapshot(s=>{if(s.exists)mergeCfg(s.data());else mergeCfg({});if(!document.activeElement||!/INPUT|SELECT/.test(document.activeElement.tagName))render()},()=>{});
  }else{
    mode="local";setSync("Modo local • dados só neste aparelho");
    tx=lsGet("tx")||[];mergeCfg(lsGet("cfg"));loaded=true;render();
  }
}

/* ---------- cálculos ---------- */
function sums(ref){
  const o={rec:0,des:0,inv:0,nec:0,des2:0,by:{}};
  for(const t of tx){ if(refOf(t)!==ref)continue; const c=catOf(t.cat); if(!c)continue; const v=+t.val||0;
    if(c.t==="Receita")o.rec+=v; else if(c.t==="Investimento")o.inv+=v;
    else{o.des+=v;o.by[c.n]=(o.by[c.n]||0)+v; if(c.g==="Necessidades")o.nec+=v;else o.des2+=v}
    if(c.t==="Investimento")o.by[c.n]=(o.by[c.n]||0)+v;}
  return o;
}
const refSel=()=>sel.y*100+sel.m;
const prevRef=r=>r%100===1?r-89:r-1;
function budgets(){const b={nec:0,des:0,inv:0};for(const c of cfg.cats){if(c.t==="Despesa"){b.des+=+c.b||0;if(c.g==="Necessidades")b.nec+=+c.b||0}else if(c.t==="Investimento")b.inv+=+c.b||0}return b}
function reserve(){
  const rc=cfg.cats.find(c=>c.r)||cfg.cats.find(c=>c.n==="Reserva de Emergência");
  let saved=+cfg.reserveStart||0; if(rc)for(const t of tx)if(t.cat===rc.n)saved+=+t.val||0;
  let tot=0,n=0;for(let m=1;m<=12;m++){const s=sums(ytd*100+m);if(s.des>0){tot+=s.des;n++}}
  const avg=n?tot/n:budgets().des;
  const goal=avg*(+cfg.months||0), aporte=rc?+rc.b||0:0;
  const left=saved>=goal?0:(aporte>0?Math.ceil((goal-saved)/aporte):null);
  return {saved,avg,goal,aporte,left,prog:goal?Math.min(1,saved/goal):0};
}
const monthsGoal=(T,C,D,r)=>{if(C>=T)return 0;if(D<=0)return null;if(!r)return Math.ceil((T-C)/D);return Math.ceil(Math.log((T*r+D)/(C*r+D))/Math.log(1+r))};
const monthsDebt=(B,r,P)=>{if(B<=0)return 0;if(P<=0)return null;if(P<=B*r)return -1;if(!r)return Math.ceil(B/P);return Math.ceil(-Math.log(1-B*r/P)/Math.log(1+r))};
function recs(){
  const r=refSel(),s=sums(r),p=sums(prevRef(r)),base=s.rec>0?s.rec:+cfg.income||0,taxa=s.rec?(s.rec-s.des)/s.rec:0,sal=s.rec-s.des-s.inv,out=[];
  const R=(lv,t)=>out.push({lv,t});
  if(!s.rec)R("",`Lance suas receitas do mês para analisarmos sua taxa de poupança.`);
  else if(taxa>=.2)R("good",`Excelente! Você poupou ${pc(taxa)} da renda (meta mínima: 20%).`);
  else if(taxa>=.1)R("warn",`Você poupou ${pc(taxa)} da renda. Para chegar a 20% faltam ${brl(.2*s.rec-(s.rec-s.des))}.`);
  else R("bad",`Taxa de poupança de ${pc(taxa)}. Reduza gastos para guardar ao menos 10% da renda.`);
  const ents=Object.entries(s.by).filter(([n])=>catOf(n)&&catOf(n).t==="Despesa").sort((a,b)=>b[1]-a[1]);
  if(ents.length)R("",`Sua maior despesa é ${esc(ents[0][0])}: ${brl(ents[0][1])} (${pc(ents[0][1]/s.des)} das despesas).`);
  const over=cfg.cats.filter(c=>c.t==="Despesa"&&c.b>0&&(s.by[c.n]||0)>c.b).sort((a,b)=>((s.by[b.n]||0)-b.b)-((s.by[a.n]||0)-a.b));
  if(over.length)R("bad",`${over.length} categoria(s) acima do orçamento. A maior estouro: ${esc(over[0].n)} (${brl((s.by[over[0].n]||0)-over[0].b)} acima do previsto).`);
  else R("good","Nenhuma categoria estourou o orçamento.");
  if(base){
    if(s.nec/base>cfg.mNec)R("warn",`Necessidades consomem ${pc(s.nec/base)} da renda (ideal até ${pc(cfg.mNec)}). Renegocie contas fixas, aluguel ou seguros.`);
    else R("good",`Necessidades em ${pc(s.nec/base)} da renda: dentro do ideal (${pc(cfg.mNec)}).`);
    if(s.des2/base>cfg.mDes)R("warn",`Desejos em ${pc(s.des2/base)} da renda (ideal até ${pc(cfg.mDes)}). Corte supérfluos: delivery, compras e assinaturas pouco usadas.`);
    else R("good",`Desejos em ${pc(s.des2/base)} da renda: sob controle.`);
  }
  const today=new Date(),isCur=today.getFullYear()*100+today.getMonth()+1===r;
  if(isCur&&base){
    const dias=new Date(sel.y,sel.m,0).getDate(),b=budgets(),proj=Math.max(s.nec,b.nec)+s.des2/today.getDate()*dias;
    R(proj>base?"bad":"",`Projeção do mês (contas fixas pelo orçamento + gastos variáveis no ritmo atual): ${brl(proj)} em despesas${proj>base?" — acima da sua renda!":` (${pc(proj/base)} da renda).`}`);
  }
  if(p.des>0){
    if(s.des>p.des*1.1)R("warn",`Despesas ${pc(s.des/p.des-1)} maiores que no mês anterior.`);
    else if(s.des<p.des*.9)R("good",`Despesas ${pc(1-s.des/p.des)} menores que no mês anterior. Continue assim!`);
    else R("","Despesas estáveis em relação ao mês anterior.");
  }
  const rs=reserve();
  if(rs.goal>0){ if(rs.prog>=1)R("good","Reserva de emergência completa! Direcione novos aportes para seus objetivos.");
    else R("",`Reserva de emergência em ${pc(rs.prog)} da meta (${brl(rs.saved)} de ${brl(rs.goal)}).${rs.left?` No aporte atual faltam ${rs.left} mes(es).`:""}`)}
  const dp=cfg.debts.reduce((a,d)=>a+(+d.p||0),0);
  if(dp>0&&base){const top=[...cfg.debts].sort((a,b)=>(+b.r||0)-(+a.r||0))[0];
    R(dp/base>.3?"bad":"warn",`Parcelas de dívidas = ${pc(dp/base)} da renda${dp/base>.3?" (limite saudável: 30%)":""}. Priorize quitar: ${esc(top.n)} (maior juros).`)}
  if(s.rec||s.des){ if(sal<0)R("bad",`Você gastou/investiu ${brl(-sal)} a mais do que recebeu. Evite cheque especial e rotativo do cartão.`);
    else if(sal>0)R("",`Sobraram ${brl(sal)} sem destino. Direcione para reserva, metas ou investimentos.`);}
  return out;
}

/* ---------- views ---------- */
const ICON={good:"✓",warn:"!",bad:"✕","":"i"};
const recHtml=()=>recs().map(x=>`<div class="rec ${x.lv}"><b aria-hidden="true">${ICON[x.lv]}</b><span>${x.t}</span></div>`).join("");
function emptyBox(){
  return `<section class="card empty"><h2 style="font-size:17px;color:var(--fg)">Comece registrando seu primeiro lançamento</h2>
  <p>Toque em <b>Lançar</b> e adicione uma receita ou um gasto. O painel, as metas e as recomendações se montam sozinhos.</p>
  <div class="tools" style="justify-content:center"><button class="btn" data-go="lancar">Fazer o primeiro lançamento</button><button class="btn ghost" data-act="examples">Ver com dados de exemplo</button></div></section>`;
}
function vPainel(){
  if(!loaded)return `<section class="card empty">Carregando seus dados…</section>`;
  const r=refSel(),s=sums(r),p=sums(prevRef(r)),base=s.rec>0?s.rec:+cfg.income||0,sal=s.rec-s.des-s.inv,taxa=s.rec?(s.rec-s.des)/s.rec:0;
  const dlt=(a,b)=>b?`<small>${a>=b?"▲":"▼"} ${pc(Math.abs(a/b-1))} vs mês anterior</small>`:`<small>sem mês anterior</small>`;
  const hasData=tx.length>0;
  let h=hasData?"":emptyBox();
  h+=`<div class="kpis">
   <div class="kpi"><span>Receitas</span><strong class="pos">${brl(s.rec)}</strong>${dlt(s.rec,p.rec)}</div>

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)return go(b.dataset.tab);
  if(b.dataset.go)return go(b.dataset.go);
  if(b.id==="prev"||b.id==="next"){sel.m+=b.id==="next"?1:-1;if(sel.m<1){sel.m=12;sel.y--}if(sel.m>12){sel.m=1;sel.y++}return render()}
  if(b.dataset.y){ytd+=+b.dataset.y;return render()}
  if(b.dataset.kind){kind=b.dataset.kind;return render()}
  if(b.dataset.del){if(armed===b.dataset.del){armed=null;await delTx(b.dataset.del)}else{armed=b.dataset.del;render()}return}
  if(b.dataset.rmg){cfg.goals.splice(+b.dataset.rmg,1);saveCfg();return render()}
  if(b.dataset.rmd){cfg.debts.splice(+b.dataset.rmd,1);saveCfg();return render()}
  if(b.dataset.addcat){const t=b.dataset.addcat;cfg.cats.push({n:"Nova categoria",t,g:t==="Despesa"?"Desejos":t==="Receita"?"Receita":"Poupança",b:0});saveCfg();return render()}
  const act=b.dataset.act;if(!act)return;
  if(act==="addgoal"){cfg.goals.push({n:"Nova meta",t:0,c:0,d:0,r:0.8});saveCfg();render()}
  if(act==="adddebt"){cfg.debts.push({n:"Nova dívida",s:0,r:0,p:0});saveCfg();render()}
  if(act==="examples")await loadExamples();
  if(act==="rmex"){for(const t of tx.filter(x=>x.ex))await delTx(t.id)}
  if(act==="csv")exportCsv();
});

document.addEventListener("change",e=>{
  const el=e.target,d=el.dataset;if(!d)return;
  const val=el.type==="number"||el.inputMode==="decimal"||el.inputMode==="numeric"?num(el.value):el.value;
  if(d.c){cfg[d.c]=d.pct?val/100:(["income","reserveStart","months"].includes(d.c)?val:el.value)}
  else if(d.s){cfg[d.s]=d.pct?val/100:val}
  else if(d.k!=null){const c=cfg.cats[+d.k];if(d.f==="b")c.b=val;else{const old=c.n;c[d.f]=el.value;if(d.f==="n"&&old!==c.n)tx.filter(t=>t.cat===old).forEach(t=>{t.cat=c.n;if(db)db.collection("tx").doc(t.id).update({cat:c.n})});if(!db)lsSet("tx",tx)}}

  else return;
  saveCfg();render();
});

}
async function exportCsv(){
  const rows=[["Data","Descrição","Categoria","Tipo","Valor","Pagamento"]].concat([...tx].sort((a,b)=>a.date>b.date?1:-1).map(t=>[t.date,t.desc,t.cat,(catOf(t.cat)||{}).t||"",String(t.val).replace(".",","),t.pay]));
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(";")).join("\n");
  try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:"lancamentos.csv",data:csv});return}}catch(e){}
  setSync("Download indisponível aqui");
}
init();
